name: Build and publish to S3

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  S3_BUCKET: harnessdemobucket
  DOTNET_VERSION: '9.0.x'

jobs:
  build-publish-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Debug: Check environment variables
      - name: Debug environment variables
        run: |
          echo "AWS_REGION: ${{ env.AWS_REGION }}"
          echo "S3_BUCKET: ${{ env.S3_BUCKET }}"
          echo "Region is set: ${{ env.AWS_REGION != '' }}"
          echo "Secrets available: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}"

      # Configure AWS credentials using Access Keys (with session token for temporary credentials)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-2

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore HarnessDemo/HarnessDemo.csproj

      # Build the application
      - name: Build
        run: dotnet build HarnessDemo/HarnessDemo.csproj --configuration Release --no-restore

      # Publish the application
      - name: Publish
        run: dotnet publish HarnessDemo/HarnessDemo.csproj --configuration Release --no-build --output ./publish

      # Create deployment package with metadata
      - name: Create deployment metadata
        run: |
          echo "{\"commit\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > ./publish/deployment-metadata.json

      # Upload to S3
      - name: Upload to S3
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Create a versioned path using build number and commit SHA
          S3_PATH="s3://${S3_BUCKET}/builds/${BUILD_NUMBER}-${COMMIT_SHA:0:7}"

          # Upload published artifacts to S3
          aws s3 sync ./publish "${S3_PATH}" --delete

          # Also upload to 'latest' for easy access
          aws s3 sync ./publish "s3://${S3_BUCKET}/latest" --delete

          echo "Deployment uploaded to: ${S3_PATH}"
          echo "S3_PATH=${S3_PATH}" >> $GITHUB_ENV

      # Upload build artifacts as GitHub artifact (optional)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish
