name: Build and publish to S3

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: 069705096352
  AWS_ROLE_ARN: arn:aws:iam::069705096352:role/harness-demo-github-action-role
  AWS_REGION: us-east-1
  ECR_REPOSITORY: harness-demo-github-actions
  IMAGE_TAG: latest

jobs:
  build-publish-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore HarnessDemo/HarnessDemo.csproj

      # Build the application
      - name: Build
        run: dotnet build HarnessDemo/HarnessDemo.csproj --configuration Release --no-restore

      # Publish the application
      - name: Publish
        run: dotnet publish HarnessDemo/HarnessDemo.csproj --configuration Release --no-build --output ./publish

      # Create deployment package with metadata
      - name: Create deployment metadata
        run: |
          echo "{\"commit\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > ./publish/deployment-metadata.json

      # Upload to S3
      - name: Upload to S3
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Create a versioned path using build number and commit SHA
          S3_PATH="s3://${S3_BUCKET}/builds/${BUILD_NUMBER}-${COMMIT_SHA:0:7}"

          LATEST_URI="${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker tag "$IMAGE_URI" "$LATEST_URI"
          docker push "$LATEST_URI"

          echo "{\"imageUri\":\"$IMAGE_URI\",\"tag\":\"$IMAGE_TAG\"}" > image-metadata.json

          echo "Deployment uploaded to: ${S3_PATH}"
          echo "S3_PATH=${S3_PATH}" >> $GITHUB_ENV

      # Upload build artifacts as GitHub artifact (optional)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

      - name: Trigger Harness deployment
        if: ${{ secrets.HARNESS_TRIGGER_URL != '' && secrets.HARNESS_API_KEY != '' }}
        env:
          HARNESS_TRIGGER_URL: ${{ secrets.HARNESS_TRIGGER_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        run: |
          echo "Triggering Harness with IMAGE_URI=${IMAGE_URI}"

          curl -sS -X POST \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"S3_PATH\":\"${S3_PATH}\",\"COMMIT\":\"${{ github.sha }}\"}" \
            "${HARNESS_TRIGGER_URL}"
